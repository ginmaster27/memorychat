version: '3.8'

services:
  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081,http://localhost:19006,http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:4000}
      - MEDIA_TTL_MS=${MEDIA_TTL_MS:-300000}
      - MEDIA_MAX_UPLOAD_BYTES=${MEDIA_MAX_UPLOAD_BYTES:-2097152}
      - MEDIA_MAX_LONGEST_SIDE=${MEDIA_MAX_LONGEST_SIDE:-1440}
      - MEDIA_MAX_IMAGES_PER_CHAT=${MEDIA_MAX_IMAGES_PER_CHAT:-10}
      - MEDIA_UPLOAD_RATE_WINDOW_MS=${MEDIA_UPLOAD_RATE_WINDOW_MS:-60000}
      - MEDIA_UPLOAD_RATE_LIMIT=${MEDIA_UPLOAD_RATE_LIMIT:-12}
      - MEDIA_ENCRYPTION_KEY=${MEDIA_ENCRYPTION_KEY:-replace-with-long-random-secret}
    restart: unless-stopped
